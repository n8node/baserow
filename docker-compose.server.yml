# Server overlay for docker-compose.all-in-one.yml (baserow.ru).
# Loads all variables from .env and sets explicit overrides.
services:
  baserow:
    env_file:
      - .env
    environment:
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-108398896}
      BASEROW_CADDY_ADDRESSES: https://baserow.ru
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BASEROW_PREMIUM_FEATURES_UNLICENSED: "true"
      # Full enterprise feature gates (including Kuma) for this fork.
      BASEROW_ENTERPRISE_FORK_UNLICENSED: "true"
      BASEROW_ENTERPRISE_SSO_AUDIT_LOG_UNLICENSED: "true"
      BASEROW_ENTERPRISE_ASSISTANT_LLM_MODEL: ${BASEROW_ENTERPRISE_ASSISTANT_LLM_MODEL:-}
      BASEROW_ENTERPRISE_ASSISTANT_LLM_TEMPERATURE: ${BASEROW_ENTERPRISE_ASSISTANT_LLM_TEMPERATURE:-}
      BASEROW_EMBEDDINGS_API_URL: ${BASEROW_EMBEDDINGS_API_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
