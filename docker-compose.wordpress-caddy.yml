# Только для стека с отдельным сервисом caddy (docker-compose.yml).
# Не использовать с docker-compose.all-in-one.yml.
services:
  caddy:
    volumes:
      - $PWD/Caddyfile.wordpress:/etc/caddy/Caddyfile
  # Ensure Caddy can resolve and reach WordPress containers on the same network.
  wordpress:
    networks:
      local:
  wordpress-db:
    networks:
      local:
