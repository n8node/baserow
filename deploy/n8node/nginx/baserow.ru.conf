# Nginx reverse proxy for baserow.ru
# WordPress = homepage + wp-admin, Baserow = application
#
# Install:
#   sudo cp nginx/baserow.ru.conf /etc/nginx/sites-available/baserow.ru
#   sudo ln -sf /etc/nginx/sites-available/baserow.ru /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d baserow.ru
#   sudo nginx -t && sudo systemctl reload nginx

upstream baserow_app {
    server 127.0.0.1:8080;
}

upstream wordpress_app {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name baserow.ru;

    client_max_body_size 100M;

    # ── WordPress: homepage (exact /) ────────────────────────────
    location = / {
        proxy_pass http://wordpress_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── WordPress: admin, content, includes, REST API ────────────
    location /wp-admin {
        proxy_pass http://wordpress_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /wp-content {
        proxy_pass http://wordpress_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /wp-includes {
        proxy_pass http://wordpress_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /wp-json {
        proxy_pass http://wordpress_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /wp-login.php {
        proxy_pass http://wordpress_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /wp-cron.php {
        proxy_pass http://wordpress_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /xmlrpc.php {
        deny all;
    }

    # ── Baserow: everything else (app, API, WebSocket) ───────────
    location / {
        proxy_pass http://baserow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
